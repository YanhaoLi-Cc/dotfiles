# =============================================================================
# tmux.conf — vim-style optimized config
# =============================================================================

# --------------- General ---------------

# Reduce escape delay (critical for vim/neovim)
set -gs escape-time 10

# Increase scrollback buffer
set -g history-limit 50000

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Enable mouse
set -g mouse on

# Start window/pane numbering at 1 (closer to keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase display time for messages
set -g display-time 1500
set -g display-panes-time 2000

# Focus events for vim autoread
set -g focus-events on

# --------------- Prefix ---------------

# Keep C-b as prefix (uncomment below to use C-a instead)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# --------------- Vi Mode ---------------

# Vi keys in copy mode
setw -g mode-keys vi

# Vi keys in status line
set -g status-keys vi

# Enter copy mode with prefix + v
bind v copy-mode

# Vi-style copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# --------------- Navigation ---------------

# Split panes with | and - (more intuitive)
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with vim keys (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys (prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Quick window switching (Alt + number, no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --------------- Utility ---------------

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Kill pane without confirmation
bind x kill-pane

# --------------- Status Bar ---------------

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80

set -g status-style "bg=#282c34,fg=#abb2bf"
set -g status-left "#[fg=#282c34,bg=#98c379,bold] #S #[default] "
set -g status-right "#[fg=#5c6370]%Y-%m-%d #[fg=#abb2bf]%H:%M "

# Window tabs
setw -g window-status-format "#[fg=#5c6370] #I:#W "
setw -g window-status-current-format "#[fg=#282c34,bg=#61afef,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#61afef"

# Message style
set -g message-style "bg=#282c34,fg=#98c379"
